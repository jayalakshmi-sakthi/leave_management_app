name: leave_management_app
description: "A new Flutter project."


publish_to: 'none' 



version: 1.0.0+1

environment:
  sdk: ^3.6.0




dependencies:
  flutter:
    sdk: flutter


    
  # Firebase core (required)
  firebase_core: ^2.24.2

  # Database (for leaves, profiles)
  cloud_firestore: ^4.15.6

  # Authentication (for login system)
  firebase_auth: ^4.16.0

  # Storage (for uploaded signed leave forms)
  firebase_storage: ^11.6.0
  
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  
  
  
  
  flutter_lints: ^5.0.0





flutter:

  
  
  
  uses-material-design: true

  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
