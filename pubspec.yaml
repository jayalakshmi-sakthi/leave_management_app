name: leave_management_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Firebase (Updated for Stability) ---
  # These versions are tested to work together without the "Pigeon" crash
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0   # Added for Background/Heads-Up alerts
  google_sign_in: ^6.0.0
  http: ^1.2.0
  http_parser: ^4.0.2 # Added for Cloudinary upload
  


  # --- UI & Fonts ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0  # Updated
  font_awesome_flutter: ^10.7.0

  # --- Utilities ---
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  intl: ^0.19.0

  # --- PDF & Images ---
  flutter_slidable: ^3.0.0 # Major update from 1.2.0
  pdf: ^3.10.0
  printing: ^5.11.0
  image_picker: ^1.1.0 # Significant update
  crop_your_image: ^1.0.0
  path_provider: ^2.1.2

  # --- URL Launcher ---
  url_launcher: ^6.2.0
  shimmer: ^3.0.0
  csv: ^6.0.0
  share_plus: ^11.0.0
  flutter_local_notifications: ^17.0.0 # ✅ Added for heads-up alerts
  onesignal_flutter: ^5.2.0
  table_calendar: ^3.1.3
  excel: ^4.0.6
  open_file_plus: ^3.4.1+1
  file_picker: ^8.0.0
  async: ^2.11.0
  syncfusion_flutter_pdfviewer: ^29.1.38

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google_logo.png